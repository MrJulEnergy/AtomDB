[project]
name = "atomdb"
version = "0.1.0"
description = "Local-first database for atomistic data (MD trajectories, DFT/MLIP datasets) with first-class provenance"
authors = [{ name = "Julian Peters", email = "108301472+MrJulEnergy@users.noreply.github.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "ase>=3.23",
    "h5py>=3.10",
    "znh5md>=0.4",
    "pyyaml>=6",
    "zstandard>=0.22",
]

[project.optional-dependencies]
md = ["MDAnalysis>=2.7"]
descriptors = ["dscribe>=2.1"]
mlip = ["mace-torch>=0.3.10"]

[project.scripts]
atomdb = "atomdb.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
extend-exclude = ["src/atomdb/db/migrations/versions"]

[tool.ruff.lint]
# B008/B006: FastAPI Depends and Typer list options are idiomatic; RUF012: SQLAlchemy mapper args
ignore = ["B008", "B006", "RUF012"]
